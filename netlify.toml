[build]
  publish = "."
  command = "echo 'No build needed - static HTML site'"

[[redirects]]
  from = "/*"
  to = "/landing-page.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[build.environment]
  NODE_VERSION = "18"

# Form handling for waitlist
[[context.production.environment]]
  NETLIFY_FORMS = "true"

# Basic settings
[build.settings]
  PROCESSING = "image_optim,html_minify"